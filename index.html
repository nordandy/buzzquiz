<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#EEF0F2;--ink:#16243A;--soft:#5B6878;--card:#FFFFFF;--line:#D3D8DE;--a:#E5484D;--b:#2D6CDF;--c:#E9A92E;--d:#1F9D6B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121A26;--ink:#EEF0F2;--soft:#9AA6B4;--card:#1C2636;--line:#2C3849;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
#app{max-width:980px;margin:0 auto;padding:20px;min-height:100%;display:flex;flex-direction:column;gap:16px}
h1,.big{font-stretch:125%;font-weight:900;line-height:1.05;letter-spacing:-.01em}
h1{font-size:clamp(26px,5.5vw,54px)}
.code{font-size:clamp(72px,16vw,170px);font-stretch:125%;font-weight:900;letter-spacing:.04em;line-height:1}
.soft{color:var(--soft)}
label{display:flex;flex-direction:column;gap:6px;font-weight:600}
input,textarea{font:inherit;font-size:18px;width:100%;padding:14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:45vh;font-size:15px;line-height:1.5}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
button{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:10px;padding:16px 22px;background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button.ghost{background:transparent;color:var(--soft);border:2px solid var(--line);font-weight:600;font-size:15px;padding:10px 14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.avs button{font-size:34px;padding:10px;background:var(--card);border:2px solid var(--line)}
.avs button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.players{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{color:#fff;border-radius:12px;padding:18px;font-weight:800;font-size:clamp(18px,2.6vw,28px);display:flex;gap:12px;align-items:center;text-align:left;min-height:90px;width:100%}
.opt .s{font-size:1.1em;opacity:.85}
.opt .n{margin-left:auto;font-stretch:125%}
.o0{background:var(--a)}.o1{background:var(--b)}.o2{background:var(--c);color:#16243A}.o3{background:var(--d)}
.dim{opacity:.22}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transform-origin:left}
.list{display:flex;flex-direction:column;gap:6px}
.list div{display:flex;justify-content:space-between;gap:12px;background:var(--card);padding:12px 14px;border-radius:10px;font-weight:700}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;border-radius:16px;padding:20px}
.center.o0,.center.o3{color:#fff}
.av{font-size:80px;line-height:1}
.ans{background:#fff;color:#16243A;border-radius:12px;padding:12px 16px;font-weight:800;font-size:20px;display:flex;gap:10px;align-items:center;justify-content:center;width:100%;max-width:420px}
.center .list{width:100%;max-width:420px}
.center .list div{color:var(--ink)}
.err{color:var(--a);font-weight:700}
#qr{background:#fff;padding:12px;border-radius:12px}
#qr img,#qr canvas{width:190px;height:190px;display:block}
.status{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:12px;font-size:13px}
@media (max-width:560px){.opts{grid-template-columns:1fr}.opt{min-height:72px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="status" class="status soft"></div>
<script>
const SB_URL = 'https://hfaaazulujezbvwqgmmk.supabase.co';
const SB_KEY = 'sb_publishable_jDz2jExQDnKe5Z_7nO-esg_9qjZabMW';
const AV = ['🦊','🐻','🐼','🐸','🐙','🦉','🐯','🦁','🐨','🐵','🦄','🐧','🐢','🦖','🐝','🐳'];
const SH = ['▲','◆','●','■'];
const EXAMPLE = 'Vad heter Sveriges huvudstad?\n*Stockholm\nGöteborg\nMalmö\nUppsala\n\nHur många sidor har en oktagon?\n6\n*8\n10\n12';

const app = document.getElementById('app');
const statusEl = document.getElementById('status');
const sb = supabase.createClient(SB_URL, SB_KEY);
const Q = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const setStatus = ok => { statusEl.textContent = ok ? '' : 'Ansluter…'; };
const base = location.origin + location.pathname;
let wake = null;
async function keepAwake(){
  if (document.visibilityState !== 'visible' || wake || !navigator.wakeLock) return;
  try { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } catch(e){}
}
document.addEventListener('visibilitychange', keepAwake);

Q.has('host') ? host() : player();

/* ================= VÄRD ================= */
function host(){
  let H = ls.get('quiz-host') || { phase:'setup', text:EXAMPLE, secs:20 };
  let out, inn, timer, rebT;
  const save = () => ls.set('quiz-host', H);
  const ids = () => Object.keys(H.players || {});
  const ranked = () => ids().sort((a,b) => H.players[b].score - H.players[a].score);

  function connect(){
    out = sb.channel('q-' + H.code + '-out');
    out.subscribe(s => { setStatus(s === 'SUBSCRIBED'); if (s === 'SUBSCRIBED' && H.phase !== 'setup') send(true); });
    inn = sb.channel('q-' + H.code + '-in', { config:{ broadcast:{ self:false } } });
    inn.on('broadcast', { event:'join' }, ({payload}) => onJoin(payload))
       .on('broadcast', { event:'answer' }, ({payload}) => onAnswer(payload))
       .subscribe();
  }

  function msg(){
    const q = H.qs && H.qs[H.qi];
    if (H.phase === 'lobby') return { ph:'lobby' };
    if (H.phase === 'question') return { ph:'q', qi:H.qi, n:H.qs.length, q:q.q, opts:q.opts, secs:H.secs, left:Math.max(0, H.qStart + H.secs*1000 - Date.now()) };
    if (H.phase === 'reveal') return { ph:'r', qi:H.qi, correct:q.correct, ans:q.opts[q.correct], res:H.res };
    if (H.phase === 'end') return { ph:'end', res:H.res, n:ids().length, top:ranked().slice(0,5).map(id => [H.players[id].av, H.players[id].name, H.players[id].score]) };
    return { ph:'lobby' };
  }
  // re: host was away and may have missed answers, so players re-send theirs
  function send(re){ if (out) out.send({ type:'broadcast', event:'state', payload:{ ...msg(), ...(re ? { re:1 } : {}) } }); }
  function reb(){ if (rebT) return; rebT = setTimeout(() => { rebT = null; send(); }, 3000); }

  function onJoin(p){
    if (!p || !p.id || H.phase === 'setup') return;
    const name = String(p.name || '').trim().slice(0,20) || 'Spelare';
    const av = AV.includes(p.av) ? p.av : AV[0];
    H.players[p.id] = { score:0, ...(H.players[p.id] || {}), name, av };
    save();
    if (H.phase === 'lobby') render(); else reb();
  }

  function onAnswer(p){
    if (!p || H.phase !== 'question' || p.qi !== H.qi || !H.players[p.id] || H.ans[p.id]) return;
    const c = Number(p.c);
    if (!(c >= 0 && c < H.qs[H.qi].opts.length)) return;
    H.ans[p.id] = { c, ms: Date.now() - H.qStart };
    save();
    const n = Object.keys(H.ans).length;
    const el = $('#cnt'); if (el) el.textContent = n + ' / ' + ids().length + ' svar';
    if (n >= ids().length) reveal();
  }

  function parse(text){
    const qs = [], errs = [];
    text.split(/\n\s*\n/).map(b => b.split('\n').map(l => l.trim()).filter(Boolean)).filter(b => b.length).forEach((b,i) => {
      const opts = b.slice(1).map(o => o.replace(/^\*\s*/, ''));
      const correct = b.slice(1).findIndex(o => o.startsWith('*'));
      const stars = b.slice(1).filter(o => o.startsWith('*')).length;
      if (opts.length < 2 || opts.length > 4) errs.push('Fråga ' + (i+1) + ' behöver 2–4 svar.');
      else if (stars !== 1) errs.push('Fråga ' + (i+1) + ' behöver exakt ett svar markerat med *.');
      else qs.push({ q:b[0], opts, correct });
    });
    if (!qs.length && !errs.length) errs.push('Skriv minst en fråga.');
    return { qs, errs };
  }

  function create(){
    const { qs, errs } = parse(H.text);
    if (errs.length) { $('#e').textContent = errs.join(' '); return; }
    Object.assign(H, { qs, code:String(Math.floor(1000 + Math.random()*9000)), players:{}, ans:{}, phase:'lobby', qi:0 });
    save(); connect(); render();
  }

  function startQ(i){
    Object.assign(H, { phase:'question', qi:i, qStart:Date.now(), ans:{} });
    save(); send(); render(); tick();
  }
  function tick(){
    clearInterval(timer);
    timer = setInterval(() => {
      const left = H.qStart + H.secs*1000 - Date.now();
      const el = $('#cd'); if (el) el.textContent = Math.max(0, Math.ceil(left/1000));
      if (left <= 0) reveal();
    }, 250);
  }

  function reveal(){
    if (H.phase !== 'question') return;
    clearInterval(timer);
    const q = H.qs[H.qi], lim = H.secs*1000;
    ids().forEach(id => {
      const a = H.ans[id];
      const g = a && a.c === q.correct ? Math.round(1000 - 500*Math.min(a.ms, lim)/lim) : 0;
      H.players[id].score += g; H.players[id].g = g;
    });
    H.res = {};
    ranked().forEach((id,i) => H.res[id] = [H.players[id].g, H.players[id].score, i+1]);
    H.phase = 'reveal'; save(); send(); render();
  }

  function next(){
    if (H.qi + 1 < H.qs.length) return startQ(H.qi + 1);
    H.res = {};
    ranked().forEach((id,i) => H.res[id] = [0, H.players[id].score, i+1]);
    H.phase = 'end'; save(); send(); render();
  }

  function reset(ask){
    if (ask && !confirm('Avsluta spelet? Alla spelare tappar rummet.')) return;
    clearInterval(timer); sb.removeAllChannels(); out = inn = null;
    H = { phase:'setup', text:H.text, secs:H.secs }; save(); setStatus(true); render();
  }

  function render(){
    const q = H.qs && H.qs[H.qi];
    if (H.phase === 'setup') {
      app.innerHTML = `
        <h1>Nytt quiz</h1>
        <p class="soft">En fråga per stycke. Första raden är frågan, sedan 2–4 svar. Markera rätt svar med *.</p>
        <textarea id="t" spellcheck="false"></textarea>
        <label style="max-width:220px">Sekunder per fråga <input id="s" type="number" min="5" max="120" inputmode="numeric"></label>
        <p class="err" id="e"></p>
        <button id="go">Skapa rum</button>`;
      $('#t').value = H.text; $('#s').value = H.secs;
      $('#t').oninput = e => { H.text = e.target.value; save(); };
      $('#s').oninput = e => { H.secs = Math.min(120, Math.max(5, parseInt(e.target.value) || 20)); save(); };
      $('#go').onclick = create;
    }
    else if (H.phase === 'lobby') {
      const link = base + '?r=' + H.code, n = ids().length;
      app.innerHTML = `
        <div class="row spread" style="align-items:flex-start">
          <div><p class="soft">Gå till länken eller skanna koden</p><div class="code">${H.code}</div><p style="word-break:break-all">${esc(link)}</p>${navigator.share ? '<button class="ghost" id="sh">Dela länken</button>' : ''}</div>
          <div id="qr"></div>
        </div>
        <div class="row spread"><h1>${n} spelare</h1><button id="start" ${n ? '' : 'disabled'}>Starta quizet</button></div>
        <div class="players">${ids().map(id => `<span class="chip">${H.players[id].av} ${esc(H.players[id].name)}</span>`).join('')}</div>
        <div><button class="ghost" id="x">Avsluta</button></div>`;
      try { new QRCode($('#qr'), { text:link, width:190, height:190 }); } catch(e){ $('#qr').remove(); }
      if ($('#sh')) $('#sh').onclick = () => navigator.share({ title:'Quiz', text:'Gå med i quizet, kod ' + H.code, url:link }).catch(() => {});
      $('#start').onclick = () => startQ(0);
      $('#x').onclick = () => reset(true);
    }
    else if (H.phase === 'question') {
      app.innerHTML = `
        <div class="row spread"><span class="soft">Fråga ${H.qi+1} av ${H.qs.length}</span><span class="big" id="cd" style="font-size:72px">${H.secs}</span></div>
        <h1>${esc(q.q)}</h1>
        <div class="opts">${q.opts.map((o,i) => `<div class="opt o${i}"><span class="s">${SH[i]}</span>${esc(o)}</div>`).join('')}</div>
        <div class="row spread"><span id="cnt" class="soft">${Object.keys(H.ans).length} / ${ids().length} svar</span><button id="rev">Visa svaret nu</button></div>`;
      $('#rev').onclick = reveal;
    }
    else if (H.phase === 'reveal') {
      const counts = q.opts.map((_,i) => Object.values(H.ans).filter(a => a.c === i).length);
      const last = H.qi + 1 >= H.qs.length;
      app.innerHTML = `
        <span class="soft">Fråga ${H.qi+1} av ${H.qs.length}</span>
        <h1>${esc(q.q)}</h1>
        <div class="opts">${q.opts.map((o,i) => `<div class="opt o${i} ${i === q.correct ? '' : 'dim'}"><span class="s">${SH[i]}</span>${esc(o)}<span class="n">${counts[i]}</span></div>`).join('')}</div>
        <div class="list">${ranked().slice(0,5).map((id,i) => `<div><span>${i+1}. ${H.players[id].av} ${esc(H.players[id].name)}</span><span>${H.players[id].score}</span></div>`).join('')}</div>
        <div class="row spread"><button class="ghost" id="x">Avsluta</button><button id="nx">${last ? 'Visa resultat' : 'Nästa fråga'}</button></div>`;
      $('#nx').onclick = next;
      $('#x').onclick = () => reset(true);
    }
    else if (H.phase === 'end') {
      app.innerHTML = `
        <h1>Resultat</h1>
        <div class="list">${ranked().slice(0,10).map((id,i) => `<div><span>${['🥇','🥈','🥉'][i] || (i+1)+'.'} ${H.players[id].av} ${esc(H.players[id].name)}</span><span>${H.players[id].score}</span></div>`).join('')}</div>
        <div><button id="new">Nytt quiz</button></div>`;
      $('#new').onclick = () => reset(false);
    }
  }

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && H.phase !== 'setup') send(true); });
  keepAwake();
  if (H.phase !== 'setup') { connect(); if (H.phase === 'question') tick(); }
  render();
}

/* ================= SPELARE ================= */
function player(){
  const code = (Q.get('r') || '').replace(/\D/g, '');
  const me = ls.get('quiz-me') || {
    id: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()),
    name:'', av: AV[Math.floor(Math.random()*AV.length)]
  };
  ls.set('quiz-me', me);
  let inn, cur = { ph:'lobby' };
  const ak = 'quiz-ans-' + code;
  let answered = ls.get(ak) ?? -1;

  if (!code) return askCode();
  if (me.name && ls.get('quiz-room') === code) join(); else form();

  function askCode(){
    app.innerHTML = `<div class="center">
      <h1>Gå med i quiz</h1>
      <input id="c" inputmode="numeric" maxlength="4" placeholder="Kod" style="max-width:220px;text-align:center;font-size:32px;font-weight:800">
      <button id="go">Fortsätt</button></div>`;
    const go = () => { const c = $('#c').value.replace(/\D/g,''); if (c.length === 4) location.search = '?r=' + c; };
    $('#go').onclick = go; $('#c').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  function form(){
    app.innerHTML = `<div class="center">
      <h1>Vem är du?</h1>
      <input id="n" maxlength="20" placeholder="Ditt namn" autocomplete="nickname">
      <div class="avs">${AV.map(a => `<button data-a="${a}" aria-pressed="${a === me.av}">${a}</button>`).join('')}</div>
      <button id="go" style="width:100%">Gå med</button></div>`;
    $('#n').value = me.name;
    document.querySelectorAll('.avs button').forEach(b => b.onclick = () => {
      me.av = b.dataset.a;
      document.querySelectorAll('.avs button').forEach(x => x.setAttribute('aria-pressed', x === b));
    });
    const go = () => {
      const n = $('#n').value.trim(); if (!n) { $('#n').focus(); return; }
      me.name = n.slice(0,20); ls.set('quiz-me', me); ls.set('quiz-room', code); join();
    };
    $('#go').onclick = go; $('#n').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  async function sendIn(event, payload, retry = 1){
    try {
      if (inn.httpSend) await inn.httpSend(event, payload);
      else if (await inn.send({ type:'broadcast', event, payload }) !== 'ok') throw new Error('send');
    } catch(e) { if (retry) setTimeout(() => sendIn(event, payload, 0), 800); }
  }

  function join(){
    keepAwake();
    sb.removeAllChannels();
    inn = sb.channel('q-' + code + '-in');
    sb.channel('q-' + code + '-out')
      .on('broadcast', { event:'state' }, ({payload}) => {
        cur = payload; render();
        const mine = ls.get(ak + '-c');
        if (cur.ph === 'q' && cur.re && answered === cur.qi && mine != null) sendIn('answer', { id:me.id, qi:cur.qi, c:mine });
      })
      .subscribe(s => {
        setStatus(s === 'SUBSCRIBED');
        if (s === 'SUBSCRIBED') sendIn('join', { id:me.id, name:me.name, av:me.av });
      });
    render();
  }

  function answer(c){
    answered = cur.qi; ls.set(ak, answered); ls.set(ak + '-c', c);
    sendIn('answer', { id:me.id, qi:cur.qi, c });
    render();
  }

  function render(){
    if (cur.ph === 'lobby') {
      app.innerHTML = `<div class="center">
        <div class="av">${me.av}</div><h1>${esc(me.name)}</h1>
        <p class="soft">Du är med. Quizet startar snart.</p>
        <button class="ghost" id="ch">Byt namn eller figur</button></div>`;
      $('#ch').onclick = form;
    }
    else if (cur.ph === 'q') {
      if (answered === cur.qi) {
        app.innerHTML = `<div class="center"><div class="av">${me.av}</div><h1>Svar skickat</h1><p class="soft">Vänta på rätt svar.</p></div>`;
        return;
      }
      app.innerHTML = `
        <span class="soft">Fråga ${cur.qi+1} av ${cur.n}</span>
        <h1 style="font-size:clamp(22px,6vw,40px)">${esc(cur.q)}</h1>
        <div class="bar"><i id="bar"></i></div>
        <div class="opts">${cur.opts.map((o,i) => `<button class="opt o${i}" data-c="${i}"><span class="s">${SH[i]}</span>${esc(o)}</button>`).join('')}</div>`;
      document.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(Number(b.dataset.c)));
      const bar = $('#bar'), left = cur.left || 0, tot = (cur.secs || 0) * 1000;
      bar.style.transform = 'scaleX(' + (tot ? Math.min(1, left / tot) : (left > 0 ? 1 : 0)) + ')';
      bar.offsetWidth;
      bar.style.transition = 'transform ' + left + 'ms linear';
      bar.style.transform = 'scaleX(0)';
    }
    else if (cur.ph === 'r') {
      const r = cur.res && cur.res[me.id];
      if (!r) { app.innerHTML = `<div class="center"><div class="av">${me.av}</div><h1>Du är med från nästa fråga</h1></div>`; return; }
      const ok = r[0] > 0;
      app.innerHTML = `<div class="center ${ok ? 'o3' : 'o0'}">
        <h1 style="font-size:64px">${ok ? 'Rätt!' : (answered === cur.qi ? 'Fel' : 'Inget svar')}</h1>
        ${ok ? `<p class="big" style="font-size:40px">+${r[0]}</p>` : ''}
        ${ok ? '' : `<p class="soft" style="color:inherit;opacity:.85">Rätt svar</p><div class="ans"><span style="color:var(--${'abcd'[cur.correct]})">${SH[cur.correct]}</span>${esc(cur.ans)}</div>`}
        <p>${r[1]} poäng totalt</p><p class="big" style="font-size:28px">Plats ${r[2]}</p></div>`;
    }
    else if (cur.ph === 'end') {
      const r = cur.res && cur.res[me.id];
      app.innerHTML = `<div class="center">
        <div class="av">${r && r[2] <= 3 ? ['🥇','🥈','🥉'][r[2]-1] : me.av}</div>
        <h1>${r ? 'Plats ' + r[2] + ' av ' + cur.n : 'Quizet är slut'}</h1>
        ${r ? `<p class="big" style="font-size:32px">${r[1]} poäng</p>` : ''}
        ${cur.top ? `<div class="list">${cur.top.map((t,i) => `<div><span>${['🥇','🥈','🥉'][i] || (i+1)+'.'} ${t[0]} ${esc(t[1])}</span><span>${t[2]}</span></div>`).join('')}</div>` : ''}
        <p class="soft">Tack för att du spelade!</p></div>`;
    }
  }
}
</script>
</body>
</html>
