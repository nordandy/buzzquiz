<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#D4D4D1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz · Dark Design Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Device panel: grey cells on hairline grid, one black display band, a big signal disc as hero.
   Every screen fits the phone height; only lists scroll inside themselves. Smallest text is 12px. */
:root{--bg:#D4D4D1;--cell:#E8E8E5;--press:#DADAD6;--line:#BDBDB8;--ink:#151515;--soft:#6E6E69;--band:#161616;--band-ink:#EDEDEA;--band-soft:#8F8F8A;--sig:#F25A1E;
  --oa:#F25A1E;--ob:#1E4E7A;--oc:#F2B01E;--od:#0E5A3A;
  --pad:16px;--sans:'Geist',system-ui,-apple-system,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--sans);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{max-width:520px;margin:0 auto;height:100%;overflow-x:hidden;display:flex;flex-direction:column;gap:1px;background:var(--line);border-inline:1px solid var(--line);overflow-y:auto}
#app>*{flex-shrink:0}
.k{font:500 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--cell);min-height:46px;padding:0 max(var(--pad),env(safe-area-inset-right,0px)) 0 max(var(--pad),env(safe-area-inset-left,0px))}
.top .logo{display:flex;align-items:center;color:var(--ink)}
.top .logo svg{height:12px;width:auto;display:block}
.top .k{text-align:right;white-space:nowrap}
.top:has(+ .mark) .logo{visibility:hidden}
.mark{background:var(--cell);padding:clamp(14px,3dvh,26px) var(--pad)}
.mark img{display:block;height:clamp(84px,18dvh,150px);width:auto;max-width:60%;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.band{background:var(--band);color:var(--band-ink);padding:18px var(--pad) 20px;display:flex;flex-direction:column;gap:10px}
.band .k{color:var(--band-soft)}
.band p{font-size:17px;line-height:1.45}
.band .ex{font-size:16px;line-height:1.45;color:#C9C9C4;max-width:60ch}
.band .link{font:400 13px/1.4 var(--mono);color:var(--band-soft);word-break:break-all}
.q,.t,.ex,.band p{overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.cell{min-width:0}
.q.long{font-size:clamp(21px,5.6vw,25px)}
.disc b.small{font-size:calc(var(--d) * .15)}
.q{font-weight:500;font-size:clamp(24px,6.6vw,30px);line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.digits{font:400 clamp(60px,19vw,92px)/1 var(--mono);letter-spacing:.04em}
.hero{container-type:size;background:var(--cell);flex:1 0 0!important;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 var(--pad);position:relative;overflow:hidden}
@container (max-height:130px){.hero>*{display:none!important}}
.hero .k{position:absolute;top:16px;left:var(--pad)}
.disc{--c:var(--sig);--p:1;--d:min(64vw,34dvh,280px,calc(100cqh - 72px));width:var(--d);margin-top:16px;aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--c) calc(var(--p)*1turn),transparent 0);box-shadow:inset 0 0 0 1px var(--line)}
/* Rattens indikator: --a är vinkeln (A vänster, B upp, C höger, D ner). Timern låter den följa tårtbitens kant. */
.disc::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--ink);left:calc(50% + cos(var(--a,180deg)) * 41%);top:calc(50% + sin(var(--a,180deg)) * 41%);transform:translate(-50%,-50%)}
#disc{--a:calc(var(--p) * 1turn - 90deg)}
.disc.ring{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.disc b{font:400 calc(var(--d) * .24)/1 var(--mono);color:var(--ink)}
.disc.light b{color:#fff}
.disc.light::after{background:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
.grid.one{grid-template-columns:minmax(0,1fr)}
.grid.one .cell.ans{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;padding-block:10px}
.grid.one .ans .row{flex:none}
.grid.one .ans .t{font-size:clamp(17px,4.8vw,20px)}
.grid.one .ans .n{order:3;margin-left:auto}
.grid.mini{grid-template-columns:minmax(0,1fr)}
.grid.mini .cell.ans{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;padding:9px var(--pad)}
.grid.mini .dot{width:22px;height:22px}
.grid.mini .t{font-size:16px;line-height:1.3;flex:1;min-width:0}
.grid.mini .n{font-size:18px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.fill{flex:1 1 auto!important;grid-auto-rows:1fr;min-height:0}
.cell{background:var(--cell);padding:14px var(--pad);min-height:72px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;color:var(--ink);font:inherit;border:0;border-radius:0;position:relative}
button.cell{cursor:pointer;touch-action:manipulation}
button.cell:active{background:var(--press)}
button.cell:disabled{color:var(--soft);cursor:default}
.cell.go{background:var(--ink);color:var(--band-ink)}
.cell.go .k{color:var(--band-soft)}
.cell.go:active{background:#2A2A2A}
.cell.go:disabled{color:#77776F}
.cell.wide{grid-column:1/-1}
.cell.slim{min-height:52px;justify-content:center}
.cell .v{font-size:21px;font-weight:500;line-height:1.15}
.cell .num{font:400 34px/1 var(--mono)}
.row{display:flex;align-items:center;gap:10px}
.ans .k{font-size:14px}
.ans .t{font-size:clamp(20px,5.6vw,24px);font-weight:500;line-height:1.15}
.ans .t.long{font-size:clamp(17px,4.6vw,19px)}
.tight .cell{min-height:0;gap:6px;padding:10px var(--pad)}
.ans .n{font:400 24px/1 var(--mono)}
.ans.dim{color:var(--soft)}.ans.dim .dot{opacity:.3}
.dot{--c:var(--ink);display:inline-block;flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.dot::after{content:"";position:absolute;width:18%;height:18%;border-radius:50%;background:rgba(255,255,255,.85);left:calc(50% + cos(var(--a,180deg)) * 30%);top:calc(50% + sin(var(--a,180deg)) * 30%);transform:translate(-50%,-50%)}
.act{position:sticky;bottom:0;z-index:2;box-shadow:0 -1px 0 var(--line),0 -8px 16px rgba(0,0,0,.06)}
.sp{flex:1 1 auto!important;background:var(--cell);min-height:0}
.face{display:inline-block;flex:none;width:24px;height:24px;line-height:0}
.face svg{width:100%;height:100%;display:block}
.face.big{width:min(56px,8dvh);height:min(56px,8dvh)}.face.xl{width:min(64vw,34dvh,280px,calc(100cqh - 72px));margin-top:16px;height:auto;aspect-ratio:1}
.swatch{align-items:center;justify-content:center;min-height:0;padding:10px}
button.cell[aria-pressed=true]{background:var(--press);box-shadow:inset 0 0 0 2px var(--ink)}
.rows{display:flex;flex-direction:column;gap:1px;background:var(--line);flex:0 1 auto!important;min-height:0;overflow-y:auto}
.rows div{background:var(--cell);display:grid;grid-template-columns:30px 26px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px var(--pad);min-height:50px}
.rows .i{font:400 14px/1 var(--mono);color:var(--soft)}
.rows .s{font:400 16px/1 var(--mono)}
.rows .me{background:var(--press);box-shadow:inset 3px 0 0 var(--sig)}
.who{background:var(--cell);padding:10px var(--pad);display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;flex:0 1 auto!important;min-height:0;max-height:24dvh;overflow-y:auto}
.who:empty{display:none}
.pwho{background:var(--cell);display:flex;gap:5px;padding:7px var(--pad);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:0 1 40px!important;min-height:0}
.pwho::-webkit-scrollbar{display:none}
.pwho:empty::before{content:'Ingen har svart ennå';font:500 12px/26px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.pwho .face{width:26px;height:26px;animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
.who .face{width:26px;height:26px;animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
.rows .nm{font-weight:500;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.players{background:var(--cell);padding:14px var(--pad);display:flex;flex-wrap:wrap;gap:10px 16px;flex:1 1 auto!important;min-height:96px;overflow-y:auto;align-content:flex-start}
.players span{display:flex;align-items:center;gap:7px;font-size:16px}
input,textarea{font:inherit;width:100%;border:0;border-radius:0;color:inherit;background:transparent}
.band input{font-size:28px;font-weight:500;padding:6px 0;border-bottom:1px solid #3A3A3A;color:var(--band-ink)}
.band input::placeholder{color:#5E5E58}
textarea{background:var(--cell);font:400 15px/1.6 var(--mono);padding:14px var(--pad);min-height:120px;resize:none;flex:1 1 auto!important}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--sig);outline-offset:-2px}
.band input:focus{outline:0;border-bottom-color:var(--sig)}
.clock{display:flex;align-items:center;gap:10px;flex:none}
.clock .pie{--p:1;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--sig) calc(var(--p)*1turn),#2E2E2E 0)}
.clock b{font:400 26px/1 var(--mono);min-width:2ch;text-align:right}
.krow{display:flex;justify-content:space-between;gap:12px}
.hero.keep{flex:1 0 clamp(150px,30dvh,300px)!important}
@media (max-height:740px){.hero.keep{flex-basis:clamp(160px,30dvh,210px)!important}}
@media (max-height:600px){.hero.keep{flex-basis:150px!important}}
@media (max-height:600px){.pwho{display:none}}
.locked{opacity:.35;pointer-events:none}
.qrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.pop .disc{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
.pop{animation:flash .9s ease-out both}
.shake .disc{animation:shake .45s ease-in-out both}
@keyframes pop{from{transform:scale(.55)}to{transform:none}}
@keyframes flash{from{background:#FBD3C2}to{background:var(--cell)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.bar{height:4px;background:#2E2E2E}
.bar i{display:block;height:100%;background:var(--sig);transform-origin:left}
.err{color:var(--sig);font:500 13px/1.35 var(--mono)}
#qr{display:grid;place-items:center;padding:12px}
#qr img,#qr canvas{width:min(132px,17dvh);height:min(132px,17dvh);display:block;image-rendering:pixelated}
.status{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:12px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--sig);background:var(--cell);padding:6px 8px}
.status:empty{display:none}
.fill .cell{min-height:56px}
/* Korta skärmar (iPhone SE m.fl.): mindre logga och tätare celler så att allt får plats */
@media (max-height:740px){
  .top:has(+ .mark.opt) .logo{visibility:visible}
  .mark.opt{display:none}
  .mark{padding:12px var(--pad)}
  .mark img{height:12dvh}
  .band{padding:14px var(--pad) 16px;gap:8px}
  .cell{min-height:62px;padding:12px var(--pad)}
  textarea{min-height:90px}
  .swatch{padding:6px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none!important}.mark img,.pop,.pop .disc,.shake .disc{animation:none}}
</style>
</head>

const DDG = "# Runde 1 · Svenske ord\n\nEn svensk kollega sier at hotellrommet er «mysigt». Hva mener hun?\nDet er lite\n*Det er koselig\nDet er gammeldags\nDet er rotete\n> «Mysigt» betyr koselig. Svenskene bruker det om alt fra hyggelige kafeer til stemningen en mørk novemberkveld.\n\nDu blir bedt om å ta med en «skottkärra» til byggeplassen. Hva henter du?\n*En trillebår\nEn spade\nEn stige\nEn verktøykasse\n> «Skottkärra» er svensk for trillebår. Nyttig på byggeplassen, særlig hvis arkitekten plutselig må gjøre noe praktisk.\n\nHotellet ber deg ta av «örngottet». Hva skal du ta av?\nDynetrekket\nSengeteppet\n*Putetrekket\nOvermadrassen\n> «Örngott» betyr putetrekk. Ordet kommer fra eldre svensk og har ingenting med ørner å gjøre.\n\nEn svensk kollega inviterer deg på «gökotta». Hva innebærer det?\nÅ ta en øl før frokost\nÅ spise en ekstra stor frokost\n*Å stå tidlig opp for å høre fuglesang\nÅ ta en lur etter lunsj\n> Man står opp svært tidlig om våren for å høre gjøken, tradisjonelt på Kristi himmelfartsdag. Frister nok mer før enn etter en kveld på Fotografiska.\n\n# Runde 2 · Sverige\n\nHva står bokstavene IKEA for?\n*Ingvar Kamprad, Elmtaryd, Agunnaryd\nIndustri, Kvalitet, Enkelhet, Arkitektur\nIngvar Kamprad, Eksport, Almhult\nInteriør, Kjøkken, Eiendom, Arkitektur\n> Kamprad vokste opp på gården Elmtaryd ved Agunnaryd i Småland. Han grunnla IKEA i 1943, bare 17 år gammel.\n\nHvorfor sier svenskene «fönster», mens nordmenn sier «vindu»?\nOrdet kommer fra latin via fransk\n*Ordet kom fra tysk, blant annet gjennom hansahandelen\nSvenskene fant opp et nytt ord på 1800-tallet\nDet er opprinnelig et finsk ord\n> «Fönster» kom fra tysk «Fenster» (opprinnelig latin) med middelalderens handel. Norsk beholdt «vindu», fra norrønt «vindauga»: vindøye.\n\nI 1967 måtte hele Sverige endre en vane over natten. Hva skjedde?\n*Sverige gikk over til høyrekjøring\nSverige innførte sommertid\nSverige forbød røyking på tog\nSverige innførte metersystemet\n> «Dagen H», 3. september 1967: klokken fem om morgenen gikk all trafikk over til høyre side. Norge kjørte allerede på høyre, så svenskene kom omsider på rett side.\n\nÉn gang i historien har Sverige hatt en dato som ikke finnes i kalenderen vår. Hvilken?\n31. april\n32. desember\n*30. februar\n31. november\n> Sverige prøvde å gå gradvis over til den gregorianske kalenderen, men ga opp og la til 30. februar 1712 for å rette opp. Fullt over gikk landet først i 1753.\n\n# Runde 3 · Stockholm\n\nFotografiska, hvor vi skal spise middag, hadde opprinnelig en ganske annen funksjon. Hva var bygningen?\nEt fengsel\nEt bryggeri\n*Et tollhus\nEt marinesykehus\n> Fotografiska holder til i Stora Tullhuset, tegnet av Ferdinand Boberg og ferdig i 1910 som del av byens toll- og havnevirksomhet.\n\nTengbom, som vi besøker på fredag, står bak en av Stockholms mest kjente bygninger. Hvilken?\nStockholms stadshus\n*Stockholms konserthus\nStockholms slott\nStockholms stadsbibliotek\n> Ivar Tengbom tegnet Konserthuset ved Hötorget, ferdig i 1926. Her deles de fleste Nobelprisene ut. Kontoret ble grunnlagt i 1906 og fyller 120 år i år.\n\nAcne Studios holder til i en brutalistisk bygning fra den kalde krigen. Hva var bygningen opprinnelig?\nDet svenske kommunistpartiets hovedkvarter\n*Den tsjekkoslovakiske ambassaden\nDen svenske etterretningstjenestens hovedkontor\nEn sovjetisk handelsskole\n> Floragatan 13 ble tegnet av Jan Bočan og Jan Šrámek og sto ferdig i 1972. Rå betong fra den kalde krigen, i dag Acne Studios' hovedkontor.\n\nStockholms stadshus har en berømt «Blå hallen», hvor Nobelbanketten arrangeres. Hva er det merkelige med salen?\n*Den har aldri vært blå\nDen ble opprinnelig bygget som svømmehall\nDen ligger egentlig under bakken\nDen har ingen rette vinkler\n> Ragnar Östberg ville male salen blå, men ombestemte seg da han så de røde teglveggene. Navnet satt allerede. En arkitekt som endret mening uten å endre prosjektnavnet.\n\n# Utslagsspørsmål · nærmest vinner\n\nHvor mange tokens brente Andreas på å bygge quizappen?\n= 423789\n> Alt for at dere skulle slippe å opprette en Kahoot-konto.";

  // ?host=test / ?host=live går alltid till sitt eget rum (0030 / 2026) med DDG-quizet.
  // Pågår redan ett spel i just det rummet fortsätter det; annars startas ett nytt.
  const pre = Q.get('host');
  const usePreset = PRESET[pre] && !(H.code === PRESET[pre] && H.phase !== 'setup');
  if (usePreset) H = { phase:'setup', text:DDG, mode:pre, room:PRESET[pre], secs:30 };
  let out, inn, timer, rebT;
  const save = () => ls.set('quiz-host', H);
  const ids = () => Object.keys(H.players || {});
  // Lika poäng avgörs av utslagsfrågan (minst avvikelse vinner)
  const tb = id => H.players[id].tb == null ? Infinity : H.players[id].tb;
  const ranked = () => ids().sort((a,b) => H.players[b].score - H.players[a].score || tb(a) - tb(b));
  // Rumskoder i följd: 0001, 0002 … Värden kan skriva en egen.
  const nextRoom = mode => {
    const last = ls.get('quiz-last-' + mode) || 0;
    const n = mode === 'test' ? last % 99 + 1 : (last < 100 || last >= 9999 ? 100 : last + 1);
    return String(n).padStart(4, '0');
  };

  function connect(){
    out = sb.channel('q-' + H.code + '-out');
    out.subscribe(s => { setStatus(s === 'SUBSCRIBED'); if (s === 'SUBSCRIBED' && H.phase !== 'setup') send(true); });
    inn = sb.channel('q-' + H.code + '-in', { config:{ broadcast:{ self:false } } });
    inn.on('broadcast', { event:'join' }, ({payload}) => onJoin(payload))
       .on('broadcast', { event:'answer' }, ({payload}) => onAnswer(payload))
       .subscribe();
  }

  function msg(){
    const q = H.qs && H.qs[H.qi];
    if (H.phase === 'lobby') return { ph:'lobby' };
    if (H.phase === 'question') return { ph:'q', qi:H.qi, n:H.qs.length, q:q.q, opts:q.opts || [], num:q.num != null ? 1 : 0, round:q.round || '', secs:H.secs,
      left:Math.max(0, H.qStart + H.secs*1000 - Date.now()), open:Math.max(0, H.qStart - Date.now()), a:Object.keys(H.ans).length, pn:ids().length, w:whoAv() };
    if (H.phase === 'reveal') return q.num != null
      ? { ph:'r', qi:H.qi, n:H.qs.length, num:1, ans:fmt(q.num), ex:q.ex || '', res:H.res }
      : { ph:'r', qi:H.qi, n:H.qs.length, correct:q.correct, ans:q.opts[q.correct], ex:q.ex || '', res:H.res, top:ranked().map(id => [H.players[id].av, H.players[id].name, H.players[id].score]) };
    if (H.phase === 'end') return { ph:'end', res:H.res, n:ids().length, top:ranked().map(id => [H.players[id].av, H.players[id].name, H.players[id].score]) };
    return { ph:'lobby' };
  }
  // re: host was away and may have missed answers, so players re-send theirs
  function send(re){ if (out) out.send({ type:'broadcast', event:'state', payload:{ ...msg(), g:H.gid, ...(re ? { re:1 } : {}) } }); }
  const whoAv = () => Object.keys(H.ans).map(id => H.players[id] && H.players[id].av).filter(Boolean);
  // Antal svar till spelarna, högst var 2:a sekund (håller trafiken nere med 90 spelare)
  let cntT = null, cntLast = -1;
  function pushCnt(){
    if (cntT) return;
    cntT = setTimeout(() => {
      cntT = null; const a = Object.keys(H.ans).length;
      if (out && H.phase === 'question' && a !== cntLast) { cntLast = a; out.send({ type:'broadcast', event:'cnt', payload:{ g:H.gid, qi:H.qi, a, n:ids().length, w:whoAv() } }); }
    }, 2000);
  }
  function reb(){ if (rebT) return; rebT = setTimeout(() => { rebT = null; send(); }, 3000); }

  function onJoin(p){
    if (!p || !p.id || H.phase === 'setup') return;
    const name = String(p.name || '').trim().slice(0,20) || 'Spiller';
    const av = okAv(p.av) ? p.av : 'bot.0';
    H.players[p.id] = { score:0, ...(H.players[p.id] || {}), name, av };
    save();
    if (H.phase === 'lobby') render(); else reb();
  }

  function onAnswer(p){
    if (!p || H.phase !== 'question' || p.qi !== H.qi || !H.players[p.id] || H.ans[p.id] || Date.now() < H.qStart - 300) return;
    const c = Number(p.c), q = H.qs[H.qi];
    if (q.num != null ? !(Number.isFinite(c) && c >= 0 && c < 1e12) : !(c >= 0 && c < q.opts.length && c % 1 === 0)) return;
    H.ans[p.id] = { c, ms: Math.max(0, Date.now() - H.qStart) };
    save();
    const n = Object.keys(H.ans).length;
    const el = $('#cnt'); if (el) el.textContent = n + '/' + ids().length;
    const who = $('#who'); if (who) who.insertAdjacentHTML('beforeend', face(H.players[p.id].av));
    if (n >= ids().length) reveal(); else pushCnt();
  }

  // Format: # rubrik startar en runda. En fråga per stycke: frågan, 2–4 svar (rätt med *),
  // eller "= tal" för en utslagsfråga. Rad som börjar med > är förklaringen.
  function parse(text){
    const qs = [], errs = [];
    let round = '';
    text.split(/\n\s*\n/).map(b => b.split('\n').map(l => l.trim()).filter(Boolean)).filter(b => b.length).forEach(b => {
      if (b[0].startsWith('#')) { round = b[0].replace(/^#+\s*/, '').slice(0, 40); return; }
      const i = qs.length + errs.length;
      const ex = b.slice(1).filter(o => o.startsWith('>')).map(o => o.replace(/^>\s*/, '')).join(' ').slice(0, 320);
      const lines = b.slice(1).filter(o => !o.startsWith('>'));
      const numLine = lines.find(o => o.startsWith('='));
      if (numLine) {
        const num = Number(numLine.slice(1).replace(/[\s ]/g, '').replace(',', '.'));
        if (!Number.isFinite(num)) errs.push('Spørsmål ' + (i+1) + ': skriv tallet etter =.');
        else qs.push({ q:b[0], num, ex, round });
        return;
      }
      const opts = lines.map(o => o.replace(/^\*\s*/, ''));
      const correct = lines.findIndex(o => o.startsWith('*'));
      const stars = lines.filter(o => o.startsWith('*')).length;
      if (opts.length < 2 || opts.length > 4) errs.push('Spørsmål ' + (i+1) + ' trenger 2–4 svar.');
      else if (stars !== 1) errs.push('Spørsmål ' + (i+1) + ' trenger nøyaktig ett svar merket med *.');
      else qs.push({ q:b[0], opts, correct, ex, round });
    });
    if (!qs.length && !errs.length) errs.push('Skriv minst ett spørsmål.');
    return { qs, errs };
  }

  function create(roomArg){
    const { qs, errs } = parse(H.text);
    const room = String(roomArg || $('#rc').value || '').replace(/\D/g, '');
    if (!/^\d{4}$/.test(room) || room === '0000') errs.push('Romkoden må være fire sifre.');
    else if (H.mode === 'test' && !isTest(room)) errs.push('Testrom har kode 0001–0099.');
    else if (H.mode === 'live' && isTest(room)) errs.push('0001–0099 er testrom. Velg 0100 eller høyere.');
    if (errs.length) { render(); $('#e').textContent = errs.join(' '); return; }
    ls.set('quiz-last-' + H.mode, Number(room));
    // gid skiljer omgångar åt när samma kod används igen
    Object.assign(H, { qs, code:room, gid:Math.random().toString(36).slice(2,8), players:{}, ans:{}, phase:'lobby', qi:0 });
    save(); connect(); render();
  }

  // Den lilla klockan i bandet visas när den stora skivan inte får plats (t.ex. när avatarerna fyller på)
  function syncClock(){ const d = $('#disc'), c = $('.band .clock'); if (d && c) c.style.display = d.offsetWidth ? 'none' : ''; }

  function startQ(i){
    // qStart = när svaren öppnar; tiden före är lästid
    cntLast = -1;
    Object.assign(H, { phase:'question', qi:i, qStart:Date.now() + READ*1000, ans:{} });
    save(); send(); render(); tick();
  }
  function tick(){
    clearInterval(timer);
    timer = setInterval(() => {
      const left = H.qStart + H.secs*1000 - Date.now(), reading = Date.now() < H.qStart;
      const f = Math.min(1, Math.max(0, left/(H.secs*1000))), sec = reading ? Math.ceil((H.qStart - Date.now())/1000) : Math.max(0, Math.ceil(left/1000));
      const rd = $('#rd'); if (rd) rd.textContent = reading ? 'Les spørsmålet · svar åpner om ' + sec : (H.qs[H.qi].round || 'Svar nå');
      const el = $('#disc'); if (el) { el.style.setProperty('--p', f); el.firstChild.textContent = pad(sec); }
      const pie = $('#pie'); if (pie) { pie.style.setProperty('--p', f); $('#sec').textContent = sec; }
      syncClock();
      if (left <= 0) reveal();
    }, 250);
  }

  function reveal(){
    if (H.phase !== 'question') return;
    clearInterval(timer);
    const q = H.qs[H.qi], lim = H.secs*1000;
    if (q.num != null) {
      // Utslagsfråga: inga poäng, avvikelsen sparas och avgör vid lika poäng
      ids().forEach(id => { const a = H.ans[id]; H.players[id].g = 0; H.players[id].tb = a ? Math.abs(a.c - q.num) : null; });
      const close = ids().filter(id => H.ans[id]).sort((a,b) => tb(a) - tb(b) || H.ans[a].ms - H.ans[b].ms);
      H.res = {};
      ids().forEach(id => { const k = close.indexOf(id); H.res[id] = [0, H.players[id].score, k + 1, H.ans[id] ? H.ans[id].c : null, H.players[id].tb]; });
      H.close = close.slice(0, 5);
      H.phase = 'reveal'; save(); send(); render(); return;
    }
    // 500–1000 poäng efter snabbhet, plus seriebonus: +100 per rätt i rad efter den första, max +500
    ids().forEach(id => {
      const a = H.ans[id], P = H.players[id], ok = !!a && a.c === q.correct;
      P.st = ok ? (P.st || 0) + 1 : 0;
      P.b = ok && P.st >= 2 ? Math.min(500, 100 * (P.st - 1)) : 0;
      P.g = ok ? Math.round(1000 - 500*Math.min(a.ms, lim)/lim) + P.b : 0;
      P.score += P.g;
    });
    H.res = {};
    // [poäng nu, totalt, plats, namn före, poäng efter den, serie, seriebonus]
    const R = ranked();
    R.forEach((id,i) => { const P = H.players[id], A = i ? H.players[R[i-1]] : null; H.res[id] = [P.g, P.score, i+1, A ? A.name : '', A ? A.score - P.score : 0, P.st, P.b]; });
    H.phase = 'reveal'; save(); send(); render();
  }

  function next(){
    if (H.qi + 1 < H.qs.length) return startQ(H.qi + 1);
    H.res = {};
    ranked().forEach((id,i) => H.res[id] = [0, H.players[id].score, i+1]);
    H.phase = 'end'; save(); send(); render();
  }

  async function reset(ask){
    if (ask && !confirm('Avslutte spillet? Alle spillerne mister rommet.')) return;
    clearInterval(timer); out = inn = null; await sb.removeAllChannels();
    H = { phase:'setup', text:H.text, secs:H.secs, mode:H.mode }; save(); setStatus(true); render();
  }

  function render(){
    const q = H.qs && H.qs[H.qi], ranks = n => ranked().slice(0,n).map(id => [H.players[id].av, H.players[id].name, H.players[id].score]);
    if (H.phase === 'setup') {
      app.innerHTML = `${head('vert')}${mark('opt')}
        <div class="band"><span class="k">Ny quiz</span><p>Ett spørsmål per avsnitt: spørsmålet, så 2–4 svar med * ved riktig. &gt; gir forklaring, = tall gir et utslagsspørsmål, # starter en runde.</p></div>
        <textarea id="t" spellcheck="false" aria-label="Spørsmål"></textarea>
        <div class="grid g3">
          <button class="cell" data-m="test" aria-pressed="${H.mode === 'test'}"><span class="k">01–99</span><span class="v">Test</span></button>
          <button class="cell" data-m="live" aria-pressed="${H.mode === 'live'}"><span class="k">100+</span><span class="v">Live</span></button>
          <button class="cell" id="s" aria-label="Bytt sekunder per spørsmål"><span class="k">Sek ↻</span><span class="num">${H.secs}</span></button>
          <label class="cell" style="grid-column:span 2"><span class="k">Romkode</span><input id="rc" class="num" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Romkode"><span class="err" id="e"></span></label>
          <button class="cell go" id="go"><span class="k">Klar</span><span class="v">Opprett rom →</span></button>
        </div>`;
      $('#t').value = H.text; $('#rc').value = H.room || nextRoom(H.mode);
      $('#t').oninput = e => { H.text = e.target.value; save(); };
      const SECS = [10, 15, 20, 30, 45, 60];
      $('#s').onclick = () => { H.secs = SECS[(SECS.indexOf(H.secs) + 1) % SECS.length] || 20; save(); render(); };
      document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
        H.mode = b.dataset.m; delete H.room;
        // Testläge laddar Stockholmsquizet om rutan är tom eller orörd
        if (H.mode === 'test' && [TEST, EXAMPLE, ''].includes(H.text.trim())) H.text = TEST;
        save(); render();
      });
      $('#go').onclick = () => create();
    }
    else if (H.phase === 'lobby') {
      const link = base + '?r=' + H.code, n = ids().length;
      app.innerHTML = `${head(isTest(H.code) ? 'lobby · test' : 'lobby')}
        <div class="band"><span class="k">${isTest(H.code) ? 'Testrom' : 'Romkode'}</span><span class="digits">${H.code}</span><span class="link">${esc(link)}</span></div>
        <div class="grid">
          <div class="cell" id="qr"></div>
          <div class="cell"><span class="k">Spillere</span><span class="num" style="font-size:56px">${pad(n)}</span></div>
          <button class="cell" id="sh"><span class="k">Lenke</span><span class="v">Del</span></button>
          <button class="cell go" id="start" ${n ? '' : 'disabled'}><span class="k">Kjør</span><span class="v">Start →</span></button>
        </div>
        <div class="players">${ids().map(id => `<span>${face(H.players[id].av, 'sm')}${esc(H.players[id].name)}</span>`).join('') || '<span class="k">Venter på spillere</span>'}</div>
        <div class="grid"><button class="cell wide slim" id="x"><span class="k">Avslutt quizen</span></button></div>`;
      try { new QRCode($('#qr'), { text:link, width:132, height:132, colorDark:'#151515', colorLight:'#E8E8E5' }); } catch(e){ $('#qr').innerHTML = '<span class="k">QR mangler</span>'; }
      $('#sh').onclick = () => navigator.share ? navigator.share({ title:'Quiz', text:'Bli med i quizen, kode ' + H.code, url:link }).catch(() => {}) : navigator.clipboard && navigator.clipboard.writeText(link).catch(() => {});
      $('#start').onclick = () => startQ(0);
      $('#x').onclick = () => reset(true);
    }
    else if (H.phase === 'question') {
      const left = Math.max(0, H.qStart + H.secs*1000 - Date.now());
      app.innerHTML = `${head('spørsmål ' + pad(H.qi+1) + '/' + pad(H.qs.length))}
        <div class="hero"><span class="k">Tid</span><div class="disc" id="disc" style="--p:${left/(H.secs*1000)}"><b>${pad(Math.ceil(left/1000))}</b></div></div>
        <div class="band"><span class="k" id="rd">${esc(q.round || '')}</span><div class="qrow"><span class="q${q.q.length > 70 ? ' long' : ''}">${esc(q.q)}</span>${clockHtml()}</div></div>
        ${q.num != null ? `<div class="grid"><div class="cell wide slim"><span class="k">Svar med et tall · nærmest vinner</span></div></div>`
          : `<div class="grid mini">${q.opts.map((o,i) => `<div class="cell ans">${adot(i)}<span class="k">${L[i]}</span><span class="t">${esc(o)}</span></div>`).join('')}</div>`}
        <div class="who" id="who" aria-label="Har svart">${Object.keys(H.ans).map(id => face(H.players[id].av)).join('')}</div>
        <div class="grid act">
          <div class="cell"><span class="k">Svar</span><span class="num" id="cnt">${Object.keys(H.ans).length}/${ids().length}</span></div>
          <button class="cell go" id="rev"><span class="k">Stopp tiden</span><span class="v">Vis svar →</span></button>
        </div>`;
      // Två tryck krävs, så att svaret inte visas för alla av misstag
      let armed = null;
      $('#rev').onclick = () => {
        if (armed) { clearTimeout(armed); return reveal(); }
        $('#rev').innerHTML = '<span class="k">Viser svaret for alle</span><span class="v">Trykk igjen</span>';
        $('#rev').style.background = 'var(--sig)';
        armed = setTimeout(() => { armed = null; const b = $('#rev'); if (b) { b.innerHTML = '<span class="k">Stopp tiden</span><span class="v">Vis svar →</span>'; b.style.background = ''; } }, 3000);
      };
      $('#sec').textContent = Math.ceil(Math.min(left, H.secs*1000)/1000); $('#pie').style.setProperty('--p', Math.min(1, left/(H.secs*1000)));
      syncClock();
    }
    else if (H.phase === 'reveal' && q.num != null) {
      const last = H.qi + 1 >= H.qs.length;
      app.innerHTML = `${head('svar ' + pad(H.qi+1) + '/' + pad(H.qs.length))}
        <div class="band"><span class="k">Riktig svar</span><span class="digits" style="font-size:clamp(40px,12vw,64px)">${fmt(q.num)}</span><span class="q long">${esc(q.q)}</span>${q.ex ? `<p class="ex">${esc(q.ex)}</p>` : ''}</div>
        <div class="band" style="padding-block:10px"><span class="k">Nærmest</span></div>
        ${rows((H.close || []).map(id => [H.players[id].av, H.players[id].name, fmt(H.ans[id].c)]))}
        <div class="sp"></div>
        <div class="grid act">
          <button class="cell" id="x"><span class="k">Avslutt</span></button>
          <button class="cell go" id="nx"><span class="k">${last ? 'Siste' : 'Neste'}</span><span class="v">${last ? 'Resultat →' : 'Neste spørsmål →'}</span></button>
        </div>`;
      $('#nx').onclick = next;
      $('#x').onclick = () => reset(true);
    }
    else if (H.phase === 'reveal') {
      const counts = q.opts.map((_,i) => Object.values(H.ans).filter(a => a.c === i).length);
      const last = H.qi + 1 >= H.qs.length;
      app.innerHTML = `${head('svar ' + pad(H.qi+1) + '/' + pad(H.qs.length))}
        <div class="band"><span class="k">Riktig svar: ${L[q.correct]}</span><span class="q${q.q.length > 70 ? ' long' : ''}">${esc(q.q)}</span>${q.ex ? `<p class="ex">${esc(q.ex)}</p>` : ''}</div>
        <div class="grid mini">${q.opts.map((o,i) => `<div class="cell ans${i === q.correct ? '' : ' dim'}">${adot(i)}<span class="k">${L[i]}</span><span class="t">${esc(o)}</span><span class="n">${counts[i]}</span></div>`).join('')}</div>
        <div class="band" style="padding-block:10px"><span class="k">Topp 5</span></div>
        ${rows(ranks(5))}
        <div class="sp"></div>
        <div class="grid act">
          <button class="cell" id="x"><span class="k">Avslutt</span></button>
          <button class="cell go" id="nx"><span class="k">${last ? 'Siste' : 'Neste'}</span><span class="v">${last ? 'Resultat →' : 'Neste spørsmål →'}</span></button>
        </div>`;
      $('#nx').onclick = next;
      $('#x').onclick = () => reset(true);
    }
    else if (H.phase === 'end') {
      app.innerHTML = `${head('resultat')}
        <div class="band"><span class="k">Sluttresultat · ${ids().length} spillere</span><span class="q">${H.players[ranked()[0]] ? esc(H.players[ranked()[0]].name) + ' vant.' : 'Ferdig.'}</span></div>
        ${rows(ranks(10))}
        <div class="sp"></div>
        <div class="grid act"><button class="cell go wide" id="new"><span class="k">Igjen</span><span class="v">Ny quiz →</span></button></div>`;
      $('#new').onclick = () => reset(false);
    }
  }

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && H.phase !== 'setup') send(true); });
  keepAwake();
  if (usePreset) return create(H.room);
  if (H.phase !== 'setup') { connect(); if (H.phase === 'question') tick(); }
  render();
}

/* ================= SPELARE ================= */
function player(){
  const code = (Q.get('r') || '').replace(/\D/g, '');
  const me = ls.get('quiz-me') || {
    id: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()),
    name:'', av: newAv()
  };
  if (!okAv(me.av)) me.av = newAv();
  ls.set('quiz-me', me);
  let inn, cur = { ph:'lobby' };
  const roomLbl = (isTest(code) ? 'test ' : 'rom ') + code;
  const ak = 'quiz-ans-' + code;
  // Senaste svaret i det här rummet: { g: spel-id, qi: fråga, c: val }
  let A = ls.get(ak), lastG = null;
  if (!A || typeof A !== 'object') A = null;
  const did = () => !!A && A.g === cur.g && A.qi === cur.qi;

  if (!code) return askCode();
  if (me.name && ls.get('quiz-room') === code) join(); else form();

  function askCode(){
    let v = '';
    app.innerHTML = `${head('quiz')}${mark()}
      <div class="band"><span class="k">Romkode</span><span class="digits" id="c">____</span></div>
      <div class="grid g3 fill">${[1,2,3,4,5,6,7,8,9,'⌫',0,'→'].map(k => `<button class="cell${k === '→' ? ' go' : ''}" data-k="${k}" style="align-items:center;justify-content:center"><span class="num">${k}</span></button>`).join('')}</div>`;
    const show = () => { $('#c').textContent = (v + '____').slice(0,4); };
    document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if (k === '⌫') v = v.slice(0,-1);
      else if (k === '→') { if (v.length === 4) location.search = '?r=' + v; return; }
      else if (v.length < 4) v += k;
      show();
    });
  }

  function form(){
    app.innerHTML = `${head(roomLbl)}${mark()}
      <div class="band"><span class="k">Navn</span><input id="n" maxlength="20" placeholder="Ditt navn" autocomplete="nickname"></div>
      <div class="band" style="padding-block:10px;background:var(--cell);color:var(--ink)"><span class="k" style="color:var(--soft)">Velg robot</span></div>
      <div class="grid g3" id="pick"></div>
      <div class="sp"></div>
      <div class="grid act"><button class="cell go wide" id="go"><span class="k">Klar</span><span class="v">Bli med →</span></button></div>`;
    $('#n').value = me.name;
    let opts = [me.av, ...eight().filter(a => a.split('.')[1] !== me.av.split('.')[1])];
    const pick = () => {
      $('#pick').innerHTML = opts.map(a => `<button class="cell swatch" data-a="${a}" aria-pressed="${a === me.av}" aria-label="Velg robot">${face(a, 'big')}</button>`).join('')
        + `<button class="cell swatch" id="mix" aria-label="Vis nye roboter"><span class="k">Bland</span><span class="num" style="font-size:24px">↻</span></button>`;
      document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
        me.av = b.dataset.a;
        document.querySelectorAll('[data-a]').forEach(x => x.setAttribute('aria-pressed', x === b));
      });
      $('#mix').onclick = () => { opts = eight(); me.av = opts[0]; pick(); };
    };
    pick();
    const go = () => {
      const n = $('#n').value.trim(); if (!n) { $('#n').focus(); return; }
      me.name = n.slice(0,20); ls.set('quiz-me', me); ls.set('quiz-room', code); unlock(); join();
    };
    $('#go').onclick = go; $('#n').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  // Skickar till värden och försöker igen tills det går fram (t.ex. efter en tunnel).
  // Ett nyare meddelande av samma slag ersätter ett äldre som väntar.
  const waiting = {};
  async function sendIn(event, payload, tries = 0){
    waiting[event] = payload;
    try {
      if (inn.httpSend) await inn.httpSend(event, payload);
      else if (await inn.send({ type:'broadcast', event, payload }) !== 'ok') throw new Error('send');
      if (waiting[event] === payload) delete waiting[event];
    } catch(e) {
      if (tries < 60) setTimeout(() => { if (waiting[event] === payload) sendIn(event, payload, tries + 1); }, Math.min(5000, 600 * 2 ** tries));
    }
  }
  addEventListener('online', () => { for (const ev in waiting) sendIn(ev, waiting[ev]); });

  // Vänta in rensningen: removeAllChannels stänger anslutningen när den är klar,
  // och utan await stängde den den nya anslutningen vi just öppnat.
  async function join(){
    keepAwake();
    if (sb.getChannels().length) await sb.removeAllChannels();
    inn = sb.channel('q-' + code + '-in');
    sb.channel('q-' + code + '-out')
      .on('broadcast', { event:'state' }, ({payload}) => {
        if (payload.ph === 'q') { endAt = Date.now() + (payload.left || 0); openAt = Date.now() + (payload.open || 0); }
        cur = payload; render();
        // Nytt spel på samma kod, värden startade efter oss, eller värden har varit borta (re)
        // och kan ha missat vår anmälan: anmäl dig igen
        if ((cur.g && cur.g !== lastG) || cur.re) { lastG = cur.g; sendIn('join', { id:me.id, name:me.name, av:me.av }); }
        if (cur.ph === 'q' && cur.re && did()) sendIn('answer', { id:me.id, qi:cur.qi, c:A.c });
      })
      .on('broadcast', { event:'cnt' }, ({payload:c}) => {
        if (cur.ph !== 'q' || c.g !== cur.g || c.qi !== cur.qi) return;
        cur.a = c.a; cur.pn = c.n; cur.w = c.w || cur.w; const el = $('#acnt'); if (el) el.textContent = cntTxt(); showWho();
      })
      .subscribe(s => {
        setStatus(s === 'SUBSCRIBED');
        if (s === 'SUBSCRIBED') sendIn('join', { id:me.id, name:me.name, av:me.av });
      });
    render();
  }

  // Nedräkning hos spelaren: sluttiden räknas från när frågan kom fram
  let endAt = 0, openAt = 0, clockT = null, fxDone = '';
  // Robotarna som har svarat; bara nya läggs till, så listan inte ritas om varannan sekund
  function showWho(){
    const el = $('#pwho'); if (!el) return;
    const w = cur.w || [], have = el.children.length;
    if (have > w.length) el.innerHTML = '';
    // Nyaste först, så att man ser dem komma in
    el.insertAdjacentHTML('afterbegin', w.slice(el.children.length).reverse().map(av => face(av)).join(''));
    el.scrollLeft = 0;
  }
  const cntTxt = () => (cur.a || 0) + '/' + (cur.pn || '–') + ' har svart';
  function clock(){
    clearInterval(clockT);
    const step = () => {
      const now = Date.now(), reading = now < openAt, left = Math.max(0, endAt - now), el = $('#sec'), pie = $('#pie');
      if (!el) return clearInterval(clockT);
      el.textContent = reading ? Math.ceil((openAt - now) / 1000) : Math.ceil(left / 1000);
      if (pie) pie.style.setProperty('--p', reading ? 1 : cur.secs ? Math.min(1, left / (cur.secs * 1000)) : 0);
      const over = !reading && left <= 0;
      const g = $('#opts'); if (g) g.classList.toggle('locked', reading || over);
      const rd = $('#rd'); if (rd) rd.textContent = reading ? 'Les spørsmålet' : over ? 'Tiden er ute' : (cur.round || 'Svar nå');
    };
    step(); clockT = setInterval(step, 250);
  }

  // Effekt när facit kommer: kort ton (följer ljudlös-knappen på iPhone), vibration där det finns, och en animation
  let ac = null;
  const unlock = () => { if (me.snd === false) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){} };
  function tone(f1, f2, t0, dur, type = 'sine'){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, ac.currentTime + t0); o.frequency.linearRampToValueAtTime(f2, ac.currentTime + t0 + dur);
    g.gain.setValueAtTime(0, ac.currentTime + t0); g.gain.linearRampToValueAtTime(.07, ac.currentTime + t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + t0 + dur);
    o.connect(g).connect(ac.destination); o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + .05);
  }
  function fx(ok){
    if (me.snd !== false && ac) try { ok ? (tone(660, 660, 0, .13), tone(990, 990, .11, .22)) : tone(240, 170, 0, .28, 'triangle'); } catch(e){}
    try { navigator.vibrate && navigator.vibrate(ok ? [25, 50, 25] : 60); } catch(e){}
  }

  function answer(c){
    unlock();
    A = { g:cur.g, qi:cur.qi, c }; ls.set(ak, A);
    sendIn('answer', { id:me.id, qi:cur.qi, c });
    render();
  }

  // Scrolla topplistan så att den egna raden syns
  const showMe = () => { const l = $('.rows'), m = $('.rows .me'); if (l && m) l.scrollTop = m.offsetTop - l.offsetTop - l.clientHeight / 2 + m.offsetHeight / 2; };

  function render(){
    if (cur.ph === 'lobby') {
      app.innerHTML = `${head(roomLbl)}
        <div class="hero"><span class="k">Du</span>${face(me.av, 'xl')}</div>
        <div class="band"><span class="k">Inne</span><span class="q">${esc(me.name)}</span><p style="color:var(--band-soft)">Quizen starter snart.</p></div>
        <div class="grid"><button class="cell slim" id="ch"><span class="k">Bytt navn/robot</span></button><button class="cell slim" id="snd" aria-label="Lyd av eller på"><span class="k">Lyd: ${me.snd === false ? 'av' : 'på'}</span></button></div>`;
      $('#ch').onclick = form;
      $('#snd').onclick = () => { me.snd = me.snd === false; ls.set('quiz-me', me); unlock(); render(); };
    }
    else if (cur.ph === 'q') {
      if (did()) {
        const c = A.c;
        app.innerHTML = `${head('spørsmål ' + pad(cur.qi+1) + '/' + pad(cur.n))}
          <div class="hero"><span class="k">Ditt svar</span>${cur.num ? `<div class="disc ring"><b class="small">${fmt(c)}</b></div>` : `<div class="disc ${c === 0 || c === 2 ? '' : 'light'}" style="--c:var(--o${'abcd'[c] || 'a'});--a:${KNOB[c] || '180deg'}"><b>${L[c] || ''}</b></div>`}</div>
          <div class="band"><div class="qrow"><div style="display:flex;flex-direction:column;gap:10px"><span class="k">Sendt · <span id="acnt">${cntTxt()}</span></span><span class="q">Venter på riktig svar.</span></div>${clockHtml()}</div></div>
          <div class="who" id="pwho"></div>`;
        showWho(); return clock();
      }
      const qband = `<div class="band"><div class="krow"><span class="k" id="rd">${esc(cur.round || '')}</span><span class="k" id="acnt">${cntTxt()}</span></div><div class="qrow"><span class="q${cur.q.length > 70 ? ' long' : ''}">${esc(cur.q)}</span>${clockHtml()}</div></div>
        <div class="bar"><i id="bar"></i></div>
        <div class="pwho" id="pwho"></div>`;
      if (cur.num) {
        // Utslagsfråga: skriv ett tal på knappsatsen
        let v = '';
        app.innerHTML = `${head('spørsmål ' + pad(cur.qi+1) + '/' + pad(cur.n))}${qband}
          <div class="cell slim" style="align-items:flex-end"><span class="num" id="nv" style="font-size:36px">–</span></div>
          <div class="grid g3 fill" id="opts">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k => `<button class="cell${k === '✓' ? ' go' : ''}" data-k="${k}" style="align-items:center;justify-content:center"><span class="num">${k}</span></button>`).join('')}</div>`;
        document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
          const k = b.dataset.k;
          if (k === '⌫') v = v.slice(0, -1);
          else if (k === '✓') { if (v) answer(Number(v)); return; }
          else if (v.length < 10) v = (v + k).replace(/^0+(?=\d)/, '');
          $('#nv').textContent = v ? fmt(v) : '–';
        });
      } else {
      app.innerHTML = `${head('spørsmål ' + pad(cur.qi+1) + '/' + pad(cur.n))}${qband}
        <div class="grid fill${cols(cur.opts)}" id="opts" style="flex:1">${cur.opts.map((o,i) => `<button class="cell ans${cur.opts.length === 3 && i === 2 ? ' wide' : ''}" data-c="${i}"><span class="row">${adot(i)}<span class="k">${L[i]}</span></span><span class="t${o.length > 26 ? ' long' : ''}">${esc(o)}</span></button>`).join('')}</div>`;
      document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => answer(Number(b.dataset.c)));
      }
      const bar = $('#bar'), open = Math.max(0, openAt - Date.now()), left = Math.max(0, endAt - Date.now() - open), tot = (cur.secs || 0) * 1000;
      bar.style.transform = 'scaleX(' + (tot ? Math.min(1, left / tot) : (left > 0 ? 1 : 0)) + ')';
      bar.offsetWidth;
      bar.style.transition = 'transform ' + left + 'ms linear ' + open + 'ms';
      bar.style.transform = 'scaleX(0)';
      showWho(); clock();
    }
    else if (cur.ph === 'r') {
      const r = cur.res && cur.res[me.id];
      if (!r) { app.innerHTML = `${head(roomLbl)}<div class="hero">${face(me.av, 'xl')}</div><div class="band"><span class="q">Du er med fra neste spørsmål.</span></div>`; return; }
      if (cur.num) {
        const top = r[2] > 0 && r[2] <= 3;
        app.innerHTML = `${head('spørsmål ' + pad(cur.qi+1) + '/' + pad(cur.n || 0))}
          <div class="hero" id="hero"><span class="k">${r[2] ? 'Nærmest, plass' : 'Ikke svart'}</span><div class="disc ${top ? '' : 'ring'}"><b>${r[2] ? pad(r[2]) : '–'}</b></div></div>
          <div class="band"><span class="k">Riktig svar</span><span class="q">${esc(cur.ans)}</span>${cur.ex ? `<p class="ex">${esc(cur.ex)}</p>` : ''}</div>
          <div class="grid">
            <div class="cell"><span class="k">Ditt svar</span><span class="num" style="font-size:26px">${fmt(r[3])}</span></div>
            <div class="cell"><span class="k">Bom</span><span class="num" style="font-size:26px">${fmt(r[4])}</span></div>
          </div>`;
        if (fxDone !== cur.g + ':' + cur.qi) { fxDone = cur.g + ':' + cur.qi; if (top) { $('#hero').classList.add('pop'); fx(true); } }
        return;
      }
      const ok = r[0] > 0, st = r[5] || 0, bonus = r[6] || 0;
      const gap = r[2] === 1 ? 'Du leder!' : r[4] === 0 ? 'Delt plass med ' + esc(r[3]) : r[4] + ' poeng bak ' + esc(r[3]);
      app.innerHTML = `${head('spørsmål ' + pad(cur.qi+1) + '/' + pad(cur.n || 0))}
        <div class="hero keep" id="hero"><span class="k">${ok ? (st >= 2 ? st + ' riktige på rad' : 'Dine poeng') : 'Ingen poeng'}</span><div class="disc ${ok ? '' : 'ring'}"><b>${ok ? '+' + r[0] : '0'}</b></div></div>
        <div class="band"><span class="k">${ok ? 'Riktig svar · +' + r[0] + (bonus ? ' (hvorav ' + bonus + ' på rad-bonus)' : '') : (did() ? 'Feil svar · riktig svar' : 'Du rakk ikke å svare · riktig svar')}</span>
          <span class="row" style="gap:12px">${adot(cur.correct)}<span class="q">${esc(cur.ans)}</span></span>${cur.ex ? `<p class="ex">${esc(cur.ex)}</p>` : ''}</div>
        <div class="grid">
          <div class="cell"><span class="k">Totalt</span><span class="num">${r[1]}</span></div>
          <div class="cell"><span class="k">Plass</span><span class="num">${pad(r[2])}</span></div>
        </div>
        ${cur.top ? `<div class="band" style="padding-block:10px"><span class="k">Stilling · ${gap}</span></div>${rows(cur.top, r[2] - 1)}` : ''}`;
      showMe();
      if (fxDone !== cur.g + ':' + cur.qi) { fxDone = cur.g + ':' + cur.qi; $('#hero').classList.add(ok ? 'pop' : 'shake'); fx(ok); }
    }
    else if (cur.ph === 'end') {
      const r = cur.res && cur.res[me.id];
      app.innerHTML = `${head('resultat')}
        <div class="hero keep"><span class="k">Plass</span><div class="disc ${r && r[2] <= 3 ? '' : 'ring'}"><b>${r ? pad(r[2]) : '–'}</b></div></div>
        <div class="band"><span class="k">${r ? 'av ' + cur.n + ' spillere' : 'Quizen er ferdig'}</span><span class="q">${r ? r[1] + ' poeng' : 'Takk for at du spilte.'}</span></div>
        ${cur.top ? rows(cur.top, r ? r[2] - 1 : -1) : ''}`;
      showMe();
    }
  }
}
</script>
</body>
</html>
