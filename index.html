<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#D4D4D1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz · Dark Design Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Device panel: grey cells on hairline grid, one black display band, a big signal disc as hero */
:root{--bg:#D4D4D1;--cell:#E8E8E5;--press:#DADAD6;--line:#BDBDB8;--ink:#151515;--soft:#7A7A75;--band:#161616;--band-ink:#EDEDEA;--band-soft:#8C8C87;--sig:#F25A1E;
  --oa:#F25A1E;--ob:#1E4E7A;--oc:#F2B01E;--od:#0E5A3A;
  --sans:'Geist',system-ui,-apple-system,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.35 var(--sans);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:1px;background:var(--line);border-inline:1px solid var(--line)}
.k{font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--cell);padding:12px max(14px,env(safe-area-inset-left,0px)) 12px max(14px,env(safe-area-inset-right,0px))}
.top .logo{font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:lowercase;color:var(--ink);display:flex;align-items:center}
.top .logo svg,.top .logo img{height:18px;width:auto;display:block}
.band{background:var(--band);color:var(--band-ink);padding:16px 16px 20px;display:flex;flex-direction:column;gap:10px}
.band .k{color:var(--band-soft)}
.q{font-weight:500;font-size:clamp(24px,6.6vw,30px);line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.digits{font:400 clamp(56px,18vw,88px)/1 var(--mono);letter-spacing:.06em}
.hero{background:var(--cell);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 16px;min-height:200px;position:relative}
.hero .k{position:absolute;top:12px;left:14px}
.disc{--c:var(--sig);--p:1;width:min(62vw,260px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1turn),transparent 0);box-shadow:inset 0 0 0 1px var(--line)}
.disc::after{content:"";position:absolute;left:9%;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--ink)}
.disc.ring{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.disc b{font:400 clamp(44px,14vw,64px)/1 var(--mono);color:var(--ink)}
.disc.light b{color:#fff}
.disc.light::after{background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.grid.g3{grid-template-columns:repeat(3,1fr)}.grid.g4{grid-template-columns:repeat(4,1fr)}
.fill{flex:1;grid-auto-rows:1fr}
.cell{background:var(--cell);padding:12px 14px;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-align:left;color:var(--ink);font:inherit;border:0;border-radius:0;position:relative}
button.cell{cursor:pointer}
button.cell:active{background:var(--press)}
button.cell:disabled{color:var(--soft);cursor:default}
.cell.go{background:var(--ink);color:var(--band-ink)}
.cell.go .k{color:var(--band-soft)}
.cell.go:active{background:#2A2A2A}
.cell.wide{grid-column:1/-1}
.cell .v{font-size:20px;font-weight:500;line-height:1.15}
.cell .num{font:400 32px/1 var(--mono)}
.row{display:flex;align-items:center;gap:10px}
.ans .t{font-size:clamp(18px,5vw,22px);font-weight:500;line-height:1.15}
.ans .n{font:400 22px/1 var(--mono)}
.ans.dim{color:var(--soft)}.ans.dim .dot{opacity:.3}
.dot{--c:var(--ink);display:inline-block;flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.dot::after{content:"";position:absolute;left:4px;top:50%;width:3px;height:3px;margin-top:-1.5px;border-radius:50%;background:rgba(255,255,255,.85)}
.dot.big{width:44px;height:44px}.dot.big::after{left:7px;width:5px;height:5px;margin-top:-2.5px}
.dot.sm{width:12px;height:12px}.dot.sm::after{display:none}
.sp{flex:1;background:var(--cell);min-height:0}
.swatch{align-items:center;justify-content:center;min-height:76px}
.swatch[aria-pressed=true]{background:var(--press);box-shadow:inset 0 0 0 2px var(--ink)}
.rows{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.rows div{background:var(--cell);display:grid;grid-template-columns:28px 14px 1fr auto;align-items:center;gap:10px;padding:11px 14px}
.rows .i,.rows .s{font:400 13px/1 var(--mono);color:var(--soft)}.rows .s{color:var(--ink);font-size:14px}
.rows .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.players{background:var(--cell);padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;flex:1;align-content:flex-start}
.players span{display:flex;align-items:center;gap:6px;font-size:13px}
input,textarea{font:inherit;width:100%;border:0;border-radius:0;color:inherit;background:transparent}
.band input{font-size:28px;font-weight:500;padding:4px 0;border-bottom:1px solid #3A3A3A;color:var(--band-ink)}
.band input::placeholder{color:#55554F}
textarea{background:var(--cell);font:400 13px/1.6 var(--mono);padding:14px;min-height:42vh;resize:none;flex:1}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--sig);outline-offset:-2px}
.bar{height:3px;background:#2E2E2E}
.bar i{display:block;height:100%;background:var(--sig);transform-origin:left}
.err{color:var(--sig);font:500 12px/1.4 var(--mono)}
#qr{display:grid;place-items:center}
#qr img,#qr canvas{width:132px;height:132px;display:block;image-rendering:pixelated}
.status{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));right:10px;font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sig)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="status" class="status"></div>
<script>
const SB_URL = 'https://hfaaazulujezbvwqgmmk.supabase.co';
const SB_KEY = 'sb_publishable_jDz2jExQDnKe5Z_7nO-esg_9qjZabMW';
// Figurer: färgade rattar, som i orthoplay.
const AV = ['#F25A1E','#1E4E7A','#F2B01E','#0E5A3A','#B4262C','#151515','#8C8C87','#F4F4F1'];
const L = ['A','B','C','D'];
// Klistra in loggan som SVG-markup här. Tom sträng ger textlogga.
const LOGO = '';
const head = (right = '') => `<header class="top"><span class="logo">${LOGO || 'dark design group'}</span><span class="k">${right}</span></header>`;
const dot = (c, cls = '') => `<i class="dot ${cls}" style="--c:${AV.includes(c) ? c : AV[0]}"></i>`;
const adot = (i, cls = '') => `<i class="dot ${cls}" style="--c:var(--o${'abcd'[i]})"></i>`;
const pad = n => String(n).padStart(2, '0');
const rows = list => `<div class="rows">${list.map(([av, name, score], i) => `<div><span class="i">${pad(i+1)}</span>${dot(av, 'sm')}<span class="nm">${esc(name)}</span><span class="s">${score}</span></div>`).join('')}</div>`;
const EXAMPLE = 'Vad heter Sveriges huvudstad?\n*Stockholm\nGöteborg\nMalmö\nUppsala\n\nHur många sidor har en oktagon?\n6\n*8\n10\n12';

const app = document.getElementById('app');
const statusEl = document.getElementById('status');
const sb = supabase.createClient(SB_URL, SB_KEY);
const Q = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const setStatus = ok => { statusEl.textContent = ok ? '' : 'Ansluter…'; };
const base = location.origin + location.pathname;
let wake = null;
async function keepAwake(){
  if (document.visibilityState !== 'visible' || wake || !navigator.wakeLock) return;
  try { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } catch(e){}
}
document.addEventListener('visibilitychange', keepAwake);

Q.has('host') ? host() : player();

/* ================= VÄRD ================= */
function host(){
  let H = ls.get('quiz-host') || { phase:'setup', text:EXAMPLE, secs:20 };
  let out, inn, timer, rebT;
  const save = () => ls.set('quiz-host', H);
  const ids = () => Object.keys(H.players || {});
  const ranked = () => ids().sort((a,b) => H.players[b].score - H.players[a].score);

  function connect(){
    out = sb.channel('q-' + H.code + '-out');
    out.subscribe(s => { setStatus(s === 'SUBSCRIBED'); if (s === 'SUBSCRIBED' && H.phase !== 'setup') send(true); });
    inn = sb.channel('q-' + H.code + '-in', { config:{ broadcast:{ self:false } } });
    inn.on('broadcast', { event:'join' }, ({payload}) => onJoin(payload))
       .on('broadcast', { event:'answer' }, ({payload}) => onAnswer(payload))
       .subscribe();
  }

  function msg(){
    const q = H.qs && H.qs[H.qi];
    if (H.phase === 'lobby') return { ph:'lobby' };
    if (H.phase === 'question') return { ph:'q', qi:H.qi, n:H.qs.length, q:q.q, opts:q.opts, secs:H.secs, left:Math.max(0, H.qStart + H.secs*1000 - Date.now()) };
    if (H.phase === 'reveal') return { ph:'r', qi:H.qi, correct:q.correct, ans:q.opts[q.correct], res:H.res };
    if (H.phase === 'end') return { ph:'end', res:H.res, n:ids().length, top:ranked().slice(0,5).map(id => [H.players[id].av, H.players[id].name, H.players[id].score]) };
    return { ph:'lobby' };
  }
  // re: host was away and may have missed answers, so players re-send theirs
  function send(re){ if (out) out.send({ type:'broadcast', event:'state', payload:{ ...msg(), ...(re ? { re:1 } : {}) } }); }
  function reb(){ if (rebT) return; rebT = setTimeout(() => { rebT = null; send(); }, 3000); }

  function onJoin(p){
    if (!p || !p.id || H.phase === 'setup') return;
    const name = String(p.name || '').trim().slice(0,20) || 'Spelare';
    const av = AV.includes(p.av) ? p.av : AV[0];
    H.players[p.id] = { score:0, ...(H.players[p.id] || {}), name, av };
    save();
    if (H.phase === 'lobby') render(); else reb();
  }

  function onAnswer(p){
    if (!p || H.phase !== 'question' || p.qi !== H.qi || !H.players[p.id] || H.ans[p.id]) return;
    const c = Number(p.c);
    if (!(c >= 0 && c < H.qs[H.qi].opts.length)) return;
    H.ans[p.id] = { c, ms: Date.now() - H.qStart };
    save();
    const n = Object.keys(H.ans).length;
    const el = $('#cnt'); if (el) el.textContent = n + '/' + ids().length;
    if (n >= ids().length) reveal();
  }

  function parse(text){
    const qs = [], errs = [];
    text.split(/\n\s*\n/).map(b => b.split('\n').map(l => l.trim()).filter(Boolean)).filter(b => b.length).forEach((b,i) => {
      const opts = b.slice(1).map(o => o.replace(/^\*\s*/, ''));
      const correct = b.slice(1).findIndex(o => o.startsWith('*'));
      const stars = b.slice(1).filter(o => o.startsWith('*')).length;
      if (opts.length < 2 || opts.length > 4) errs.push('Fråga ' + (i+1) + ' behöver 2–4 svar.');
      else if (stars !== 1) errs.push('Fråga ' + (i+1) + ' behöver exakt ett svar markerat med *.');
      else qs.push({ q:b[0], opts, correct });
    });
    if (!qs.length && !errs.length) errs.push('Skriv minst en fråga.');
    return { qs, errs };
  }

  function create(){
    const { qs, errs } = parse(H.text);
    if (errs.length) { $('#e').textContent = errs.join(' '); return; }
    Object.assign(H, { qs, code:String(Math.floor(1000 + Math.random()*9000)), players:{}, ans:{}, phase:'lobby', qi:0 });
    save(); connect(); render();
  }

  function startQ(i){
    Object.assign(H, { phase:'question', qi:i, qStart:Date.now(), ans:{} });
    save(); send(); render(); tick();
  }
  function tick(){
    clearInterval(timer);
    timer = setInterval(() => {
      const left = H.qStart + H.secs*1000 - Date.now();
      const el = $('#disc'); if (el) { el.style.setProperty('--p', Math.max(0, left/(H.secs*1000))); el.firstChild.textContent = pad(Math.max(0, Math.ceil(left/1000))); }
      if (left <= 0) reveal();
    }, 250);
  }

  function reveal(){
    if (H.phase !== 'question') return;
    clearInterval(timer);
    const q = H.qs[H.qi], lim = H.secs*1000;
    ids().forEach(id => {
      const a = H.ans[id];
      const g = a && a.c === q.correct ? Math.round(1000 - 500*Math.min(a.ms, lim)/lim) : 0;
      H.players[id].score += g; H.players[id].g = g;
    });
    H.res = {};
    ranked().forEach((id,i) => H.res[id] = [H.players[id].g, H.players[id].score, i+1]);
    H.phase = 'reveal'; save(); send(); render();
  }

  function next(){
    if (H.qi + 1 < H.qs.length) return startQ(H.qi + 1);
    H.res = {};
    ranked().forEach((id,i) => H.res[id] = [0, H.players[id].score, i+1]);
    H.phase = 'end'; save(); send(); render();
  }

  function reset(ask){
    if (ask && !confirm('Avsluta spelet? Alla spelare tappar rummet.')) return;
    clearInterval(timer); sb.removeAllChannels(); out = inn = null;
    H = { phase:'setup', text:H.text, secs:H.secs }; save(); setStatus(true); render();
  }

  function render(){
    const q = H.qs && H.qs[H.qi], ranks = n => ranked().slice(0,n).map(id => [H.players[id].av, H.players[id].name, H.players[id].score]);
    if (H.phase === 'setup') {
      app.innerHTML = `${head('värd')}
        <div class="band"><span class="k">Nytt quiz</span><p>En fråga per stycke. Första raden är frågan, sedan 2–4 svar. Markera rätt svar med *.</p></div>
        <textarea id="t" spellcheck="false" aria-label="Frågor"></textarea>
        <div class="grid g3">
          <button class="cell" id="dn" aria-label="Färre sekunder"><span class="k">Tid</span><span class="num">−</span></button>
          <div class="cell"><span class="k">Sek/fråga</span><span class="num" id="s">${H.secs}</span></div>
          <button class="cell" id="up" aria-label="Fler sekunder"><span class="k">&nbsp;</span><span class="num">+</span></button>
          <button class="cell go wide" id="go"><span class="k">Klar</span><span class="v">Skapa rum →</span><span class="err" id="e"></span></button>
        </div>`;
      $('#t').value = H.text;
      $('#t').oninput = e => { H.text = e.target.value; save(); };
      const step = d => { H.secs = Math.min(120, Math.max(5, H.secs + d)); $('#s').textContent = H.secs; save(); };
      $('#dn').onclick = () => step(-5); $('#up').onclick = () => step(5);
      $('#go').onclick = create;
    }
    else if (H.phase === 'lobby') {
      const link = base + '?r=' + H.code, n = ids().length;
      app.innerHTML = `${head('värd · lobby')}
        <div class="band"><span class="k">Rumskod</span><span class="digits">${H.code}</span><span class="k" style="text-transform:none;letter-spacing:0;word-break:break-all">${esc(link)}</span></div>
        <div class="grid">
          <div class="cell" id="qr"></div>
          <div class="cell"><span class="k">Spelare</span><span class="num" style="font-size:56px">${pad(n)}</span></div>
          <button class="cell" id="sh"><span class="k">Länk</span><span class="v">Dela</span></button>
          <button class="cell go" id="start" ${n ? '' : 'disabled'}><span class="k">Kör</span><span class="v">Starta →</span></button>
        </div>
        <div class="players">${ids().map(id => `<span>${dot(H.players[id].av, 'sm')}${esc(H.players[id].name)}</span>`).join('') || '<span class="k">Väntar på spelare</span>'}</div>
        <div class="grid"><button class="cell wide" id="x" style="min-height:48px"><span class="k">Avsluta</span></button></div>`;
      try { new QRCode($('#qr'), { text:link, width:132, height:132, colorDark:'#151515', colorLight:'#E8E8E5' }); } catch(e){ $('#qr').innerHTML = '<span class="k">QR saknas</span>'; }
      $('#sh').onclick = () => navigator.share ? navigator.share({ title:'Quiz', text:'Gå med i quizet, kod ' + H.code, url:link }).catch(() => {}) : navigator.clipboard && navigator.clipboard.writeText(link).catch(() => {});
      $('#start').onclick = () => startQ(0);
      $('#x').onclick = () => reset(true);
    }
    else if (H.phase === 'question') {
      const left = Math.max(0, H.qStart + H.secs*1000 - Date.now());
      app.innerHTML = `${head('fråga ' + pad(H.qi+1) + '/' + pad(H.qs.length))}
        <div class="hero"><span class="k">Tid</span><div class="disc" id="disc" style="--p:${left/(H.secs*1000)}"><b>${pad(Math.ceil(left/1000))}</b></div></div>
        <div class="band"><span class="q">${esc(q.q)}</span></div>
        <div class="grid">${q.opts.map((o,i) => `<div class="cell ans${q.opts.length === 3 && i === 2 ? ' wide' : ''}"><span class="row">${adot(i)}<span class="k">${L[i]}</span></span><span class="t">${esc(o)}</span></div>`).join('')}</div>
        <div class="grid">
          <div class="cell"><span class="k">Svar</span><span class="num" id="cnt">${Object.keys(H.ans).length}/${ids().length}</span></div>
          <button class="cell go" id="rev"><span class="k">Stoppa</span><span class="v">Visa svar →</span></button>
        </div>`;
      $('#rev').onclick = reveal;
    }
    else if (H.phase === 'reveal') {
      const counts = q.opts.map((_,i) => Object.values(H.ans).filter(a => a.c === i).length);
      const last = H.qi + 1 >= H.qs.length;
      app.innerHTML = `${head('fråga ' + pad(H.qi+1) + '/' + pad(H.qs.length) + ' · facit')}
        <div class="band"><span class="k">Rätt svar: ${L[q.correct]}</span><span class="q">${esc(q.q)}</span></div>
        <div class="grid">${q.opts.map((o,i) => `<div class="cell ans${i === q.correct ? '' : ' dim'}${q.opts.length === 3 && i === 2 ? ' wide' : ''}"><span class="row">${adot(i)}<span class="k">${L[i]}</span><span class="n" style="margin-left:auto">${counts[i]}</span></span><span class="t">${esc(o)}</span></div>`).join('')}</div>
        <div class="band" style="padding-block:10px"><span class="k">Topp 5</span></div>
        ${rows(ranks(5))}
        <div class="sp"></div>
        <div class="grid">
          <button class="cell" id="x"><span class="k">Avsluta</span></button>
          <button class="cell go" id="nx"><span class="k">${last ? 'Sista' : 'Nästa'}</span><span class="v">${last ? 'Resultat →' : 'Nästa fråga →'}</span></button>
        </div>`;
      $('#nx').onclick = next;
      $('#x').onclick = () => reset(true);
    }
    else if (H.phase === 'end') {
      app.innerHTML = `${head('resultat')}
        <div class="band"><span class="k">Slutresultat · ${ids().length} spelare</span><span class="q">${H.players[ranked()[0]] ? esc(H.players[ranked()[0]].name) + ' vann.' : 'Klart.'}</span></div>
        ${rows(ranks(10))}
        <div class="sp"></div>
        <div class="grid"><button class="cell go wide" id="new"><span class="k">Igen</span><span class="v">Nytt quiz →</span></button></div>`;
      $('#new').onclick = () => reset(false);
    }
  }

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && H.phase !== 'setup') send(true); });
  keepAwake();
  if (H.phase !== 'setup') { connect(); if (H.phase === 'question') tick(); }
  render();
}

/* ================= SPELARE ================= */
function player(){
  const code = (Q.get('r') || '').replace(/\D/g, '');
  const me = ls.get('quiz-me') || {
    id: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()),
    name:'', av: AV[Math.floor(Math.random()*AV.length)]
  };
  if (!AV.includes(me.av)) me.av = AV[Math.floor(Math.random()*AV.length)];
  ls.set('quiz-me', me);
  let inn, cur = { ph:'lobby' };
  const ak = 'quiz-ans-' + code;
  let answered = ls.get(ak) ?? -1;

  if (!code) return askCode();
  if (me.name && ls.get('quiz-room') === code) join(); else form();

  function askCode(){
    let v = '';
    app.innerHTML = `${head('quiz')}
      <div class="band"><span class="k">Rumskod</span><span class="digits" id="c">____</span></div>
      <div class="grid g3 fill">${[1,2,3,4,5,6,7,8,9,'⌫',0,'→'].map(k => `<button class="cell${k === '→' ? ' go' : ''}" data-k="${k}" style="align-items:center;justify-content:center"><span class="num">${k}</span></button>`).join('')}</div>`;
    const show = () => { $('#c').textContent = (v + '____').slice(0,4); };
    document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      if (k === '⌫') v = v.slice(0,-1);
      else if (k === '→') { if (v.length === 4) location.search = '?r=' + v; return; }
      else if (v.length < 4) v += k;
      show();
    });
  }

  function form(){
    app.innerHTML = `${head('rum ' + code)}
      <div class="band"><span class="k">Namn</span><input id="n" maxlength="20" placeholder="Ditt namn" autocomplete="nickname"></div>
      <div class="band" style="padding-block:10px;background:var(--cell);color:var(--ink)"><span class="k" style="color:var(--soft)">Välj färg</span></div>
      <div class="grid g4">${AV.map(a => `<button class="cell swatch" data-a="${a}" aria-pressed="${a === me.av}" aria-label="Färg">${dot(a, 'big')}</button>`).join('')}</div>
      <div class="sp"></div>
      <div class="grid"><button class="cell go wide" id="go"><span class="k">Klar</span><span class="v">Gå med →</span></button></div>`;
    $('#n').value = me.name;
    document.querySelectorAll('.swatch').forEach(b => b.onclick = () => {
      me.av = b.dataset.a;
      document.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', x === b));
    });
    const go = () => {
      const n = $('#n').value.trim(); if (!n) { $('#n').focus(); return; }
      me.name = n.slice(0,20); ls.set('quiz-me', me); ls.set('quiz-room', code); join();
    };
    $('#go').onclick = go; $('#n').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  async function sendIn(event, payload, retry = 1){
    try {
      if (inn.httpSend) await inn.httpSend(event, payload);
      else if (await inn.send({ type:'broadcast', event, payload }) !== 'ok') throw new Error('send');
    } catch(e) { if (retry) setTimeout(() => sendIn(event, payload, 0), 800); }
  }

  function join(){
    keepAwake();
    sb.removeAllChannels();
    inn = sb.channel('q-' + code + '-in');
    sb.channel('q-' + code + '-out')
      .on('broadcast', { event:'state' }, ({payload}) => {
        cur = payload; render();
        const mine = ls.get(ak + '-c');
        if (cur.ph === 'q' && cur.re && answered === cur.qi && mine != null) sendIn('answer', { id:me.id, qi:cur.qi, c:mine });
      })
      .subscribe(s => {
        setStatus(s === 'SUBSCRIBED');
        if (s === 'SUBSCRIBED') sendIn('join', { id:me.id, name:me.name, av:me.av });
      });
    render();
  }

  function answer(c){
    answered = cur.qi; ls.set(ak, answered); ls.set(ak + '-c', c);
    sendIn('answer', { id:me.id, qi:cur.qi, c });
    render();
  }

  function render(){
    const meDisc = (txt = '', cls = '') => `<div class="disc ${cls}" style="--c:${me.av}"><b>${txt}</b></div>`;
    const light = ['#151515','#1E4E7A','#0E5A3A','#B4262C'].includes(me.av) ? 'light' : '';
    if (cur.ph === 'lobby') {
      app.innerHTML = `${head('rum ' + code)}
        <div class="hero"><span class="k">Du</span>${meDisc('', light)}</div>
        <div class="band"><span class="k">Inne</span><span class="q">${esc(me.name)}</span><p style="color:var(--band-soft)">Quizet startar snart.</p></div>
        <div class="grid"><button class="cell wide" id="ch" style="min-height:52px"><span class="k">Byt namn eller färg</span></button></div>`;
      $('#ch').onclick = form;
    }
    else if (cur.ph === 'q') {
      if (answered === cur.qi) {
        const c = ls.get(ak + '-c');
        app.innerHTML = `${head('fråga ' + pad(cur.qi+1) + '/' + pad(cur.n))}
          <div class="hero"><span class="k">Ditt svar</span><div class="disc ${c === 0 || c === 2 ? '' : 'light'}" style="--c:var(--o${'abcd'[c] || 'a'})"><b>${L[c] || ''}</b></div></div>
          <div class="band"><span class="k">Skickat</span><span class="q">Väntar på rätt svar.</span></div>`;
        return;
      }
      app.innerHTML = `${head('fråga ' + pad(cur.qi+1) + '/' + pad(cur.n))}
        <div class="band"><span class="q">${esc(cur.q)}</span></div>
        <div class="bar"><i id="bar"></i></div>
        <div class="grid fill" style="flex:1">${cur.opts.map((o,i) => `<button class="cell ans${cur.opts.length === 3 && i === 2 ? ' wide' : ''}" data-c="${i}"><span class="row">${adot(i)}<span class="k">${L[i]}</span></span><span class="t">${esc(o)}</span></button>`).join('')}</div>`;
      document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => answer(Number(b.dataset.c)));
      const bar = $('#bar'), left = cur.left || 0, tot = (cur.secs || 0) * 1000;
      bar.style.transform = 'scaleX(' + (tot ? Math.min(1, left / tot) : (left > 0 ? 1 : 0)) + ')';
      bar.offsetWidth;
      bar.style.transition = 'transform ' + left + 'ms linear';
      bar.style.transform = 'scaleX(0)';
    }
    else if (cur.ph === 'r') {
      const r = cur.res && cur.res[me.id];
      if (!r) { app.innerHTML = `${head('rum ' + code)}<div class="hero">${meDisc('', light)}</div><div class="band"><span class="q">Du är med från nästa fråga.</span></div>`; return; }
      const ok = r[0] > 0;
      app.innerHTML = `${head('fråga ' + pad(cur.qi+1) + ' · facit')}
        <div class="hero"><span class="k">${ok ? 'Poäng' : 'Missat'}</span><div class="disc ${ok ? '' : 'ring'}"><b>${ok ? '+' + r[0] : '0'}</b></div></div>
        <div class="band"><span class="k">${ok ? 'Rätt' : (answered === cur.qi ? 'Fel' : 'Inget svar')}</span>
          <span class="row" style="gap:12px">${adot(cur.correct)}<span class="q">${esc(cur.ans)}</span></span></div>
        <div class="grid">
          <div class="cell"><span class="k">Totalt</span><span class="num">${r[1]}</span></div>
          <div class="cell"><span class="k">Plats</span><span class="num">${pad(r[2])}</span></div>
        </div>`;
    }
    else if (cur.ph === 'end') {
      const r = cur.res && cur.res[me.id];
      app.innerHTML = `${head('resultat')}
        <div class="hero"><span class="k">Plats</span><div class="disc ${r && r[2] <= 3 ? '' : 'ring'}"><b>${r ? pad(r[2]) : '–'}</b></div></div>
        <div class="band"><span class="k">${r ? 'av ' + cur.n + ' spelare' : 'Quizet är slut'}</span><span class="q">${r ? r[1] + ' poäng' : 'Tack för att du spelade.'}</span></div>
        ${cur.top ? rows(cur.top) : ''}`;
    }
  }
}
</script>
</body>
</html>
